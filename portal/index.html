<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal — PROFE</title>
    <style>
        :root {
            --bg:         #0d0d0d;
            --surface:    #1a1a1a;
            --surface2:   #252525;
            --accent:     #0a84ff;
            --accent-dim: rgba(10,132,255,.15);
            --text:       #f2f2f7;
            --text-dim:   #8e8e93;
            --border:     #2c2c2e;
            --success:    #30d158;
            --danger:     #ff453a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* ── HEADER ───────────────────────────────────────────── */
        #header {
            display: flex; align-items: center; gap: 16px;
            padding: 10px 20px; border-bottom: 1px solid var(--border);
            background: var(--surface); flex-shrink: 0;
        }
        #header h1 { font-size: 1rem; font-weight: 700; letter-spacing: .05em; }
        .week-nav { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .week-nav button {
            background: var(--surface2); border: 1px solid var(--border);
            color: var(--text); padding: 4px 12px; border-radius: 6px;
            cursor: pointer; font-size: .95rem;
        }
        .week-nav button:hover { border-color: var(--accent); }
        #week-label { font-size: .85rem; color: var(--text-dim); min-width: 160px; text-align: center; }

        /* ── LAYOUT ───────────────────────────────────────────── */
        #main { display: flex; flex: 1; overflow: hidden; }

        /* ── SIDEBAR ──────────────────────────────────────────── */
        #sidebar {
            width: 190px; border-right: 1px solid var(--border);
            background: var(--surface); overflow-y: auto; flex-shrink: 0;
        }
        .day-block { border-bottom: 1px solid var(--border); }
        .day-label {
            padding: 7px 12px; font-size: .68rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .07em;
            color: var(--text-dim); background: var(--surface2);
        }
        .day-label.hoy { color: var(--accent); }
        .curso-btn {
            display: block; width: 100%; padding: 9px 14px;
            background: none; border: none; border-bottom: 1px solid var(--border);
            color: var(--text); text-align: left; cursor: pointer; font-size: .88rem;
            transition: background .12s;
        }
        .curso-btn:hover { background: var(--surface2); }
        .curso-btn.activo { background: var(--accent-dim); color: var(--accent); font-weight: 600; }

        /* ── CONTENT ──────────────────────────────────────────── */
        #content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        #empty-state {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: var(--text-dim); font-size: .95rem;
        }
        #session-view { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        #session-view.visible { display: flex; }

        /* Session header */
        #sh {
            padding: 12px 20px; border-bottom: 1px solid var(--border);
            background: var(--surface); display: flex; align-items: center; gap: 12px; flex-shrink: 0;
        }
        #sh-curso { font-size: 1.1rem; font-weight: 700; }
        #sh-fecha { font-size: .82rem; color: var(--text-dim); }
        #btn-presentar {
            margin-left: auto; background: var(--accent); color: #fff;
            border: none; padding: 6px 16px; border-radius: 8px;
            cursor: pointer; font-size: .88rem; font-weight: 600;
        }
        #btn-presentar:hover { opacity: .85; }

        /* Tabs */
        #tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
        .tab {
            padding: 10px 22px; background: none; border: none;
            border-bottom: 2px solid transparent; color: var(--text-dim);
            cursor: pointer; font-size: .88rem; font-weight: 600;
        }
        .tab.activa { color: var(--accent); border-bottom-color: var(--accent); }

        /* Tab panes */
        #panes { flex: 1; overflow: hidden; }
        .pane { height: 100%; display: none; }
        .pane.activa { display: flex; }

        /* ── PANE PLAN ────────────────────────────────────────── */
        #pane-plan { gap: 0; }
        .col {
            display: flex; flex-direction: column; overflow: hidden;
            border-right: 1px solid var(--border);
        }
        .col:last-child { border-right: none; }
        #col-pendientes { width: 48%; }
        #col-plan { flex: 1; }
        .col-titulo {
            padding: 9px 14px; font-size: .7rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .06em;
            color: var(--text-dim); border-bottom: 1px solid var(--border);
            background: var(--surface); flex-shrink: 0;
        }
        .col-body { flex: 1; overflow-y: auto; padding: 10px; }

        /* Pendiente fuente */
        .pend-src {
            padding: 8px 10px; background: var(--surface2);
            border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 6px; cursor: pointer; font-size: .88rem;
            display: flex; align-items: flex-start; gap: 8px;
        }
        .pend-src:hover { border-color: var(--accent); }
        .pend-src .plus { color: var(--accent); flex-shrink: 0; }
        .pend-cat-label {
            font-size: .68rem; color: var(--text-dim);
            display: block; margin-bottom: 3px;
        }

        /* Plan ítem */
        .plan-item {
            padding: 8px 10px; background: var(--surface2);
            border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 6px; display: flex; align-items: center;
            gap: 8px; font-size: .88rem;
        }
        .plan-item .item-txt { flex: 1; }
        .item-btns { display: flex; gap: 3px; flex-shrink: 0; }
        .item-btns button {
            background: none; border: 1px solid var(--border);
            color: var(--text-dim); padding: 2px 7px;
            border-radius: 4px; cursor: pointer; font-size: .75rem;
        }
        .item-btns button:hover { border-color: var(--accent); color: var(--accent); }
        .item-btns .btn-del:hover { border-color: var(--danger); color: var(--danger); }

        /* Manual add */
        .add-manual {
            display: flex; gap: 8px; padding: 10px 12px;
            border-top: 1px solid var(--border);
            background: var(--surface); flex-shrink: 0;
        }
        .add-manual input {
            flex: 1; background: var(--surface2); border: 1px solid var(--border);
            color: var(--text); padding: 7px 10px; border-radius: 8px; font-size: .88rem;
        }
        .add-manual input:focus { outline: none; border-color: var(--accent); }
        .add-manual button {
            background: var(--accent); color: #fff; border: none;
            padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: .9rem;
        }

        /* ── PANE PRESENTACIÓN ────────────────────────────────── */
        #pane-pres { gap: 0; }
        #col-plan-ref { width: 20%; }
        #col-editor { width: 38%; }
        #col-preview { flex: 1; }
        .plan-ref-item {
            padding: 7px 8px; border-bottom: 1px solid var(--border);
            font-size: .82rem; color: var(--text-dim);
        }
        #pres-textarea {
            flex: 1; resize: none; background: var(--surface2); border: none;
            color: var(--text); padding: 14px; font-family: 'SF Mono','Fira Mono',monospace;
            font-size: .88rem; line-height: 1.65; outline: none;
        }
        #save-status {
            padding: 5px 12px; font-size: .72rem; color: var(--text-dim);
            border-top: 1px solid var(--border); background: var(--surface);
            text-align: right; flex-shrink: 0;
        }
        #preview-wrap { flex: 1; overflow-y: auto; padding: 10px; background: var(--bg); }
        .slide-card {
            background: #1c1c2e; border: 1px solid var(--border);
            border-radius: 10px; padding: 20px 24px; margin-bottom: 10px;
            aspect-ratio: 16/9; display: flex; flex-direction: column;
            justify-content: center; overflow: hidden; position: relative;
        }
        .slide-n { position: absolute; top: 8px; right: 10px; font-size: .62rem; color: #444; }
        .slide-card h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; line-height: 1.2; }
        .slide-card h2 { font-size: .95rem; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
        .slide-card p  { font-size: .8rem; line-height: 1.6; margin-bottom: 5px; }
        .slide-card ul { padding-left: 14px; }
        .slide-card li { font-size: .8rem; line-height: 1.6; margin-bottom: 3px; }

        /* ── PRESENT MODE ─────────────────────────────────────── */
        #present-overlay {
            position: fixed; inset: 0; background: #000;
            display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
        }
        #present-overlay.activo { display: flex; }
        #present-slide {
            width: 88vw; max-width: 1200px; background: #1c1c2e;
            border-radius: 18px; padding: 64px 80px;
            display: flex; flex-direction: column; justify-content: center;
            min-height: 55vh; cursor: pointer;
        }
        #present-slide h1 { font-size: clamp(2rem, 4vw, 3.5rem); font-weight: 700; margin-bottom: 16px; line-height: 1.15; }
        #present-slide h2 { font-size: clamp(1.2rem, 2.5vw, 2rem); font-weight: 600; color: #9090a8; margin-bottom: 12px; }
        #present-slide p  { font-size: clamp(1rem, 2vw, 1.6rem); line-height: 1.7; margin-bottom: 10px; }
        #present-slide ul { padding-left: 28px; }
        #present-slide li { font-size: clamp(1rem, 2vw, 1.6rem); line-height: 1.8; margin-bottom: 6px; }
        #present-footer {
            margin-top: 20px; display: flex; align-items: center; gap: 16px;
        }
        #present-counter { color: #555; font-size: .9rem; min-width: 60px; text-align: center; }
        .pnav-btn {
            background: rgba(255,255,255,.08); border: none; color: #ccc;
            padding: 8px 22px; border-radius: 8px; cursor: pointer; font-size: .95rem;
        }
        .pnav-btn:hover { background: rgba(255,255,255,.15); }
        #btn-salir {
            position: fixed; top: 14px; right: 18px;
            background: rgba(255,255,255,.08); border: none; color: #aaa;
            padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: .82rem;
        }
        #btn-salir:hover { background: rgba(255,255,255,.15); }

        /* ── UTILIDADES ───────────────────────────────────────── */
        .vacío { color: var(--text-dim); font-size: .88rem; padding: 14px; text-align: center; }
        .sec-label {
            font-size: .68rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: .06em; color: var(--text-dim); padding: 8px 2px 4px;
        }
        #toast {
            position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 7px 18px; border-radius: 20px;
            font-size: .88rem; opacity: 0; transition: opacity .22s;
            pointer-events: none; z-index: 9999;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>

<!-- ── PRESENT MODE ──────────────────────────────────────────── -->
<div id="present-overlay">
    <div id="present-slide" onclick="nextSlide()"></div>
    <div id="present-footer">
        <button class="pnav-btn" onclick="prevSlide()">← Anterior</button>
        <span id="present-counter">— / —</span>
        <button class="pnav-btn" onclick="nextSlide()">Siguiente →</button>
    </div>
    <button id="btn-salir" onclick="exitPresent()">✕ Salir</button>
</div>

<!-- ── DASHBOARD ─────────────────────────────────────────────── -->
<div id="app">
    <div id="header">
        <h1>📋 PORTAL</h1>
        <div class="week-nav">
            <button onclick="cambiarSemana(-1)">‹</button>
            <span id="week-label"></span>
            <button onclick="cambiarSemana(1)">›</button>
        </div>
    </div>
    <div id="main">
        <nav id="sidebar"></nav>
        <div id="content">
            <div id="empty-state">← Selecciona un curso para planificar</div>
            <div id="session-view">
                <div id="sh">
                    <span id="sh-curso"></span>
                    <span id="sh-fecha"></span>
                    <button id="btn-presentar" onclick="abrirPresentar()">▶ Presentar</button>
                </div>
                <div id="tabs">
                    <button class="tab activa" onclick="cambiarTab('plan')">📌 Plan de clase</button>
                    <button class="tab" onclick="cambiarTab('pres')">🖥 Presentación</button>
                </div>
                <div id="panes">
                    <!-- Plan -->
                    <div id="pane-plan" class="pane activa">
                        <div class="col" id="col-pendientes">
                            <div class="col-titulo">Pendientes disponibles</div>
                            <div class="col-body" id="pendientes-lista"></div>
                        </div>
                        <div class="col" id="col-plan">
                            <div class="col-titulo">Plan de clase</div>
                            <div class="col-body" id="plan-lista"></div>
                            <div class="add-manual">
                                <input id="input-manual" type="text" placeholder="Agregar ítem manualmente..."
                                       onkeydown="if(event.key==='Enter')agregarManual()">
                                <button onclick="agregarManual()">＋</button>
                            </div>
                        </div>
                    </div>
                    <!-- Presentación -->
                    <div id="pane-pres" class="pane">
                        <div class="col" id="col-plan-ref">
                            <div class="col-titulo">Plan de clase</div>
                            <div class="col-body" id="plan-ref"></div>
                        </div>
                        <div class="col" id="col-editor">
                            <div class="col-titulo">Texto de presentación</div>
                            <textarea id="pres-textarea"
                                placeholder="# Título de la diapositiva&#10;&#10;Texto de cuerpo&#10;- Punto 1&#10;- Punto 2&#10;&#10;---&#10;&#10;# Segunda diapositiva"
                                oninput="onEditorInput()"></textarea>
                            <div id="save-status">—</div>
                        </div>
                        <div class="col" id="col-preview">
                            <div class="col-titulo">Preview</div>
                            <div id="preview-wrap"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL  = 'https://bfinpxcwcsteintikrtt.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_nKng6T9w2MA0fLrJ778Jog_2ZV_BrsB';

    const HORARIO = {
        'LUNES':     ['ORIENTACIÓN','TERCERO','CUARTO','CUERDAS'],
        'MARTES':    ['ENLACE','SEXTO','RECREO','QUINTO'],
        'MIÉRCOLES': ['PRIMERO'],
        'JUEVES':    ['SEGUNDO','SEPTIMO','KIDS CASTIGADAS','OCTAVO','CASTIGADAS']
    };
    const DIAS    = ['LUNES','MARTES','MIÉRCOLES','JUEVES'];
    const DIA_JS  = { 1:'LUNES', 2:'MARTES', 3:'MIÉRCOLES', 4:'JUEVES' };
    const CAT_LABEL = { pendientes_sala:'🎵 Sala', pendientes_planificacion:'🧠 Planificación' };

    // ── Estado ────────────────────────────────────────────────
    let sb = null;
    let ctxPorNombre = {};
    let semanaOffset = 0;
    let cursoActivo = null;
    let fechaActiva = null;
    let sesionId    = null;
    let planItems   = [];
    let slides      = [];
    let slideActual = 0;
    let saveTimer   = null;

    // ── Supabase init ─────────────────────────────────────────
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    sb.from('contextos').select('id,nombre').eq('activo', true).then(({ data }) => {
        (data || []).forEach(c => { ctxPorNombre[c.nombre] = c; });
        renderSidebar();
    });

    // ── Modo presentación por URL ─────────────────────────────
    const urlParams = new URLSearchParams(location.search);
    const presentSesionId = urlParams.get('sesion');
    if (presentSesionId) {
        document.getElementById('app').style.display = 'none';
        iniciarModoPresent(presentSesionId);
    }

    // ── Helpers de fecha ──────────────────────────────────────
    function fechaLocal(d) {
        return d.getFullYear() + '-' +
            String(d.getMonth()+1).padStart(2,'0') + '-' +
            String(d.getDate()).padStart(2,'0');
    }
    function getFechasSemana(offset = 0) {
        const hoy = new Date();
        const dow = hoy.getDay();
        const toLun = dow === 0 ? -6 : 1 - dow;
        const lun = new Date(hoy);
        lun.setDate(hoy.getDate() + toLun + offset * 7);
        lun.setHours(0,0,0,0);
        return Object.fromEntries(DIAS.map((d,i) => [d, new Date(lun.getTime() + i*86400000)]));
    }
    function titleCase(s) {
        return s.toLowerCase().replace(/(?:^|\s)\S/g, c => c.toUpperCase());
    }
    function esc(s) {
        return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Sidebar ───────────────────────────────────────────────
    function cambiarSemana(delta) { semanaOffset += delta; renderSidebar(); }

    function renderSidebar() {
        const fechas = getFechasSemana(semanaOffset);
        const hoyStr = fechaLocal(new Date());
        const diasNombre = { LUNES:'Lun', MARTES:'Mar', MIÉRCOLES:'Mié', JUEVES:'Jue' };
        const vals = Object.values(fechas);
        const fmt = d => d.toLocaleDateString('es-CL', { day:'numeric', month:'short' });
        document.getElementById('week-label').textContent = `${fmt(vals[0])} – ${fmt(vals[3])}`;

        const sb_ = document.getElementById('sidebar');
        sb_.innerHTML = '';
        DIAS.forEach(dia => {
            const dateObj = fechas[dia];
            const fStr = fechaLocal(dateObj);
            const esHoy = fStr === hoyStr;
            const bloque = document.createElement('div');
            bloque.className = 'day-block';
            const lbl = document.createElement('div');
            lbl.className = 'day-label' + (esHoy ? ' hoy' : '');
            lbl.textContent = `${diasNombre[dia]} ${dateObj.getDate()}`;
            bloque.appendChild(lbl);
            HORARIO[dia].forEach(curso => {
                const btn = document.createElement('button');
                btn.className = 'curso-btn' + (curso === cursoActivo && fStr === fechaActiva ? ' activo' : '');
                btn.textContent = titleCase(curso);
                btn.addEventListener('click', () => seleccionarSesion(curso, fStr, dateObj));
                bloque.appendChild(btn);
            });
            sb_.appendChild(bloque);
        });
    }

    // ── Selección de sesión ───────────────────────────────────
    async function seleccionarSesion(curso, fecha, dateObj) {
        cursoActivo = curso;
        fechaActiva = fecha;
        document.getElementById('sh-curso').textContent = titleCase(curso);
        document.getElementById('sh-fecha').textContent = dateObj.toLocaleDateString('es-CL', {
            weekday:'long', day:'numeric', month:'long', year:'numeric'
        });
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('session-view').classList.add('visible');
        renderSidebar();
        sesionId = await asegurarSesion(curso, fecha);
        // Resetear a tab plan
        cambiarTab('plan');
        await Promise.all([cargarPendientes(), cargarPlan()]);
    }

    async function asegurarSesion(curso, fecha) {
        const ctx = ctxPorNombre[curso.toUpperCase()];
        if (!ctx) return null;
        let { data: ses } = await sb.from('sesiones').select('id')
            .eq('contexto_id', ctx.id).eq('fecha', fecha).maybeSingle();
        if (!ses) {
            const { data: nueva } = await sb.from('sesiones')
                .insert({ contexto_id: ctx.id, fecha }).select('id').single();
            ses = nueva;
        }
        return ses?.id || null;
    }

    // ── Pendientes (fuentes para el plan) ─────────────────────
    async function cargarPendientes() {
        const lista = document.getElementById('pendientes-lista');
        lista.innerHTML = '<div class="vacío">Cargando...</div>';
        if (!sesionId) { lista.innerHTML = '<div class="vacío">Sin sesión</div>'; return; }
        const { data } = await sb.from('pendientes')
            .select('id,categoria,texto')
            .eq('sesion_id', sesionId)
            .in('categoria', ['pendientes_sala','pendientes_planificacion']);
        lista.innerHTML = '';
        if (!data?.length) {
            lista.innerHTML = '<div class="vacío">Sin pendientes de sala o planificación para esta sesión</div>';
            return;
        }
        ['pendientes_sala','pendientes_planificacion'].forEach(catId => {
            const items = data.filter(p => p.categoria === catId);
            if (!items.length) return;
            const lbl = document.createElement('div');
            lbl.className = 'sec-label';
            lbl.textContent = CAT_LABEL[catId];
            lista.appendChild(lbl);
            items.forEach(p => {
                const el = document.createElement('div');
                el.className = 'pend-src';
                el.innerHTML = `<span class="plus">＋</span><span>${esc(p.texto)}</span>`;
                el.addEventListener('click', () => agregarAlPlan(p.texto, p.id));
                lista.appendChild(el);
            });
        });
    }

    // ── Plan ──────────────────────────────────────────────────
    async function cargarPlan() {
        if (!sesionId) return;
        const { data } = await sb.from('plan_sesion_items')
            .select('id,texto,orden,completado,incluido')
            .eq('sesion_id', sesionId).eq('incluido', true)
            .order('orden');
        planItems = data || [];
        renderPlan();
        renderPlanRef();
    }

    function renderPlan() {
        const lista = document.getElementById('plan-lista');
        lista.innerHTML = '';
        if (!planItems.length) {
            lista.innerHTML = '<div class="vacío">Sin ítems aún — agrega desde pendientes o escribe uno</div>';
            return;
        }
        planItems.forEach((item, idx) => {
            const el = document.createElement('div');
            el.className = 'plan-item';
            el.innerHTML = `<span class="item-txt">${esc(item.texto)}</span>
                <div class="item-btns">
                    ${idx > 0 ? `<button onclick="moverItem('${item.id}',-1)">↑</button>` : ''}
                    ${idx < planItems.length-1 ? `<button onclick="moverItem('${item.id}',1)">↓</button>` : ''}
                    <button class="btn-del" onclick="eliminarItem('${item.id}')">✕</button>
                </div>`;
            lista.appendChild(el);
        });
    }

    function renderPlanRef() {
        const ref = document.getElementById('plan-ref');
        ref.innerHTML = '';
        if (!planItems.length) {
            ref.innerHTML = '<div class="vacío">Sin plan definido</div>';
            return;
        }
        planItems.forEach((item, idx) => {
            const el = document.createElement('div');
            el.className = 'plan-ref-item';
            el.textContent = `${idx+1}. ${item.texto}`;
            ref.appendChild(el);
        });
    }

    async function agregarAlPlan(texto, pendienteId = null) {
        if (!sesionId) return;
        if (planItems.some(i => i.texto === texto)) { toast('Ya está en el plan'); return; }
        const orden = planItems.length;
        const { data } = await sb.from('plan_sesion_items').insert({
            sesion_id: sesionId, texto, orden,
            origen: pendienteId ? 'srp' : 'manual',
            pendiente_id: pendienteId || null
        }).select('id,texto,orden,completado,incluido').single();
        if (data) { planItems.push(data); renderPlan(); renderPlanRef(); }
    }

    async function agregarManual() {
        const input = document.getElementById('input-manual');
        const texto = input.value.trim();
        if (!texto) return;
        input.value = '';
        await agregarAlPlan(texto, null);
    }

    async function eliminarItem(itemId) {
        await sb.from('plan_sesion_items').delete().eq('id', itemId);
        planItems = planItems.filter(i => i.id !== itemId);
        planItems.forEach((it, idx) => { it.orden = idx; });
        renderPlan(); renderPlanRef();
    }

    async function moverItem(itemId, delta) {
        const idx = planItems.findIndex(i => i.id === itemId);
        if (idx < 0) return;
        const ni = idx + delta;
        if (ni < 0 || ni >= planItems.length) return;
        [planItems[idx], planItems[ni]] = [planItems[ni], planItems[idx]];
        planItems.forEach((it, i) => { it.orden = i; });
        await Promise.all(planItems.map((it, i) =>
            sb.from('plan_sesion_items').update({ orden: i }).eq('id', it.id)
        ));
        renderPlan(); renderPlanRef();
    }

    // ── Presentación ──────────────────────────────────────────
    async function cargarPresentacion() {
        if (!sesionId) return;
        const { data } = await sb.from('presentaciones').select('contenido')
            .eq('sesion_id', sesionId).maybeSingle();
        document.getElementById('pres-textarea').value = data?.contenido || '';
        actualizarPreview();
    }

    function onEditorInput() {
        actualizarPreview();
        document.getElementById('save-status').textContent = 'Guardando...';
        clearTimeout(saveTimer);
        saveTimer = setTimeout(guardarPresentacion, 2000);
    }

    async function guardarPresentacion() {
        if (!sesionId) return;
        const contenido = document.getElementById('pres-textarea').value;
        const { error } = await sb.from('presentaciones').upsert(
            { sesion_id: sesionId, contenido, updated_at: new Date().toISOString() },
            { onConflict: 'sesion_id' }
        );
        document.getElementById('save-status').textContent = error ? '⚠️ Error al guardar' : '✓ Guardado';
    }

    // ── Parser de slides ──────────────────────────────────────
    function parsearSlides(texto) {
        if (!texto.trim()) return [];
        return texto.split(/\n---\n|^---\n/m).map(s => s.trim()).filter(Boolean);
    }

    function renderizarSlideHtml(texto) {
        const lineas = texto.split('\n');
        let html = ''; let enLista = false;
        lineas.forEach(l => {
            if (l.startsWith('# ')) {
                if (enLista) { html += '</ul>'; enLista = false; }
                html += `<h1>${esc(l.slice(2))}</h1>`;
            } else if (l.startsWith('## ')) {
                if (enLista) { html += '</ul>'; enLista = false; }
                html += `<h2>${esc(l.slice(3))}</h2>`;
            } else if (l.startsWith('- ')) {
                if (!enLista) { html += '<ul>'; enLista = true; }
                html += `<li>${esc(l.slice(2))}</li>`;
            } else if (l.trim()) {
                if (enLista) { html += '</ul>'; enLista = false; }
                html += `<p>${esc(l)}</p>`;
            } else {
                if (enLista) { html += '</ul>'; enLista = false; }
            }
        });
        if (enLista) html += '</ul>';
        return html;
    }

    function actualizarPreview() {
        const texto = document.getElementById('pres-textarea').value;
        slides = parsearSlides(texto);
        const wrap = document.getElementById('preview-wrap');
        wrap.innerHTML = '';
        if (!slides.length) {
            wrap.innerHTML = '<div class="vacío">Escribe para ver el preview</div>';
            return;
        }
        slides.forEach((s, i) => {
            const card = document.createElement('div');
            card.className = 'slide-card';
            card.innerHTML = `<span class="slide-n">${i+1}/${slides.length}</span>` + renderizarSlideHtml(s);
            wrap.appendChild(card);
        });
    }

    // ── Tabs ──────────────────────────────────────────────────
    function cambiarTab(tab) {
        document.querySelectorAll('.tab').forEach((t, i) =>
            t.classList.toggle('activa', ['plan','pres'][i] === tab)
        );
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('activa'));
        document.getElementById(`pane-${tab}`).classList.add('activa');
        if (tab === 'pres') { cargarPresentacion(); renderPlanRef(); }
    }

    // ── Modo presentación ─────────────────────────────────────
    function abrirPresentar() {
        slides = parsearSlides(document.getElementById('pres-textarea').value);
        slideActual = 0;
        document.getElementById('present-overlay').classList.add('activo');
        renderSlideActual();
        document.addEventListener('keydown', teclaPresent);
    }

    async function iniciarModoPresent(sId) {
        const intentar = async () => {
            if (!sb) { setTimeout(intentar, 300); return; }
            const { data } = await sb.from('presentaciones').select('contenido')
                .eq('sesion_id', sId).maybeSingle();
            slides = parsearSlides(data?.contenido || '');
            slideActual = 0;
            document.getElementById('present-overlay').classList.add('activo');
            renderSlideActual();
            document.addEventListener('keydown', teclaPresent);
            document.getElementById('present-overlay').addEventListener('click', e => {
                if (e.target.id === 'present-overlay') nextSlide();
            });
        };
        intentar();
    }

    function exitPresent() {
        document.getElementById('present-overlay').classList.remove('activo');
        document.removeEventListener('keydown', teclaPresent);
    }

    function teclaPresent(e) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevSlide(); }
        else if (e.key === 'Escape') exitPresent();
    }

    function nextSlide() { if (slideActual < slides.length-1) { slideActual++; renderSlideActual(); } }
    function prevSlide() { if (slideActual > 0) { slideActual--; renderSlideActual(); } }

    function renderSlideActual() {
        const el = document.getElementById('present-slide');
        if (!slides.length) {
            el.innerHTML = '<p style="color:#555">Sin contenido</p>';
            document.getElementById('present-counter').textContent = '—';
            return;
        }
        el.innerHTML = renderizarSlideHtml(slides[slideActual]);
        document.getElementById('present-counter').textContent = `${slideActual+1} / ${slides.length}`;
    }

    // ── Toast ─────────────────────────────────────────────────
    let toastTimer;
    function toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }
</script>
</body>
</html>
